spring.config.import=optional:file:.env[.properties]
spring.application.name=project-planner
spring.main.keep-alive=true

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

#logging
logging.file.name=logs/project-planner.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.level.uz.mukhammad.projectplanner=DEBUG

# Database
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5434}/planner
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

app.admin-telegram-id=${ADMIN_TELEGRAM_ID}