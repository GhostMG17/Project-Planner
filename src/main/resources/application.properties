spring.config.import=optional:file:.env[.properties]
spring.application.name=project-planner
spring.main.keep-alive=true

# Logging
logging.file.name=logs/project-planner.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.level.uz.mukhammad.projectplanner=DEBUG

# Database
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5434}/planner
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Telegram
app.admin-telegram-id=${ADMIN_TELEGRAM_ID}
telegram.bot.group-chat-id=${TELEGRAM_GROUP_ID}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

# Timezone
app.timezone=${APP_TIMEZONE:Asia/Tashkent}

# Notifications
app.notifications.cron=${NOTIFICATIONS_CRON:0 0 * * * *}
app.notifications.send-from-hour=${NOTIFICATIONS_SEND_FROM_HOUR:9}
app.notifications.send-to-hour=${NOTIFICATIONS_SEND_TO_HOUR:20}
app.notifications.remind-days-before=${NOTIFICATIONS_REMIND_DAYS_BEFORE:2,1}
app.notifications.pm-days-before=${NOTIFICATIONS_PM_DAYS_BEFORE:1}

app.risk.threshold=${RISK_THRESHOLD:3}
app.workload.overload-threshold=${WORKLOAD_OVERLOAD_THRESHOLD:5}

# Dashboard
app.dashboard.thread-id=${DASHBOARD_THREAD_ID}
app.dashboard.daily-cron=${DASHBOARD_DAILY_CRON:0 0 9 * * MON-FRI}
app.dashboard.weekly-cron=${DASHBOARD_WEEKLY_CRON:0 0 17 * * FRI}